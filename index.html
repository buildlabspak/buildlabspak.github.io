<style>

html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px))}

h1,h2,h3{font-family:Sora,"Segoe UI",system-ui,sans-serif;color:var(--navy);margin:0;line-height:1.15}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.ico{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

.hero{position:relative;overflow:hidden;padding:64px 0 56px;background:

.hero h1{font-size:clamp(36px,5.2vw,62px);font-weight:700;letter-spacing:-.02em}

.logo3d{position:relative;width:100%;aspect-ratio:1100/411;transform-style:preserve-3d;will-change:transform}
.logo3d img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;transition:transform 1.5s cubic-bezier(.2,.8,.2,1)}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}.hero{padding:44px 0}}

.quick{margin-top:-28px;position:relative;z-index:2}

.qcard{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);text-decoration:none}

section.block{padding:72px 0}
section.alt{background:var(--surface);border-block:1px solid var(--line)}
.head{max-width:620px;margin-bottom:30px}
.head h2{font-size:clamp(28px,3.6vw,40px);margin-bottom:10px}
.soon{color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;transition:transform .2s,box-shadow .2s,border-color .2s}

.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#b9d3ea}
.card .qicon{width:54px;height:54px;border-radius:14px;margin-bottom:16px;background:linear-gradient(135deg,var(--navy),var(--sky))!important;color:#fff!important}
.card h3{font-size:19px;margin-bottom:6px}
.card p{margin:0;color:var(--muted);text-align:justify;hyphens:auto}
.thumb{height:130px;border-radius:10px;background:var(--tint);margin-bottom:16px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:14px}
.tile{border-radius:14px;border:1.5px dashed #b8cfe4;background:var(--tint);display:grid;place-items:center;color:var(--muted);font-size:15px}
.tile.big{grid-column:span 2;grid-row:span 2}
@media(max-width:760px){.gallery{grid-template-columns:repeat(2,1fr)}}
.social{display:flex;flex-wrap:wrap;gap:12px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font-weight:600;color:var(--navy);box-shadow:var(--shadow)}
.chip:hover{border-color:var(--sky)}.chip svg{width:20px;height:20px;fill:currentColor}
.cta{background:linear-gradient(120deg,var(--navy),#1d5a94);color:#fff;border-radius:22px;padding:44px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.cta h2{color:#fff;font-size:clamp(24px,3vw,34px)}.cta p{margin:8px 0 0;color:#cfe3f4}
.cta .btn{background:#fff;color:var(--navy);border-color:#fff}
footer{background:var(--navy);color:#c9d8ea;padding:48px 0 28px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px}
footer h3{color:#fff;font-size:16px;margin-bottom:12px}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
footer a{text-decoration:none}footer a:hover{color:#fff}
.copy{margin-top:30px;padding-top:18px;border-top:1px solid rgba(255,255,255,.15);font-size:14px}
@media(max-width:760px){.fgrid{grid-template-columns:1fr}}
.thumb{overflow:hidden}.tile{overflow:hidden}
.thumb img,.tile img{width:100%;height:100%;object-fit:cover;display:block}
.date{font-size:14px;color:var(--muted);margin-bottom:6px}
.card a{color:var(--navy);font-weight:600}
#about .head,#workshops .head{max-width:780px}#x_about,#x_workshops{text-align:justify;hyphens:auto;white-space:pre-line}
.block .head{margin-left:auto;margin-right:auto;text-align:center}.social{justify-content:center}
.soon{white-space:pre-line}.more{display:inline-block;margin-top:10px;font-weight:600;color:var(--navy)}

body{background:#f6f9fd}
.hero{padding:88px 0 76px;background:radial-gradient(900px 440px at 88% -10%,rgba(44,155,209,.24),transparent 65%),radial-gradient(700px 380px at -5% 100%,rgba(18,48,92,.10),transparent 65%),radial-gradient(rgba(18,48,92,.09) 1px,transparent 1.2px) 0 0/28px 28px,var(--bg)}
.hero h1{font-size:clamp(40px,6vw,72px);line-height:1.05;letter-spacing:-.03em}
.stage{background:rgba(255,255,255,.68);backdrop-filter:blur(8px);border:1px solid #fff;box-shadow:0 30px 70px rgba(18,48,92,.16)}
.stats .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px;padding-top:44px;text-align:center}
.stat b{display:block;font:700 clamp(30px,4.4vw,46px) Sora,sans-serif;color:var(--navy)}.stat span{color:var(--muted)}
.card{border-radius:20px}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(18,48,92,.13)}
.thumb{height:170px;border-radius:14px}
.badge{display:inline-block;background:var(--tint);color:var(--navy);font-weight:600;font-size:13px;padding:4px 12px;border-radius:99px;margin-bottom:10px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.abtn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;background:var(--navy);color:#fff;font-weight:600;font-size:15px;text-decoration:none}
.abtn .ico{width:18px;height:18px}.abtn:hover{background:var(--sky)}
.abtn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}.abtn.ghost:hover{background:var(--tint)}
.soc{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.soc a{display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:600;color:var(--navy);text-decoration:none;box-shadow:var(--shadow);transition:all .2s}
.soc a svg{width:24px;height:24px;fill:currentColor}.soc a:hover{background:var(--b);border-color:var(--b);color:#fff;transform:translateY(-3px)}
.ccard{display:flex;gap:16px;align-items:flex-start}.ccard .qicon{margin:0;flex:none}.ccard h3{margin-bottom:4px}.ccard a{text-decoration:none}
.team{text-align:center}.avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;background:var(--tint);display:grid;place-items:center;overflow:hidden;color:var(--navy)}
.avatar img{width:100%;height:100%;object-fit:cover}.avatar .ico{width:40px;height:40px}.role{color:var(--muted)}
.faqs{max-width:820px;margin:0 auto;display:grid;gap:12px}
details.faq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 20px}
details.faq summary{cursor:pointer;font:600 17px Sora,sans-serif;color:var(--navy);padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";font-size:22px;color:var(--sky)}details.faq[open] summary::after{content:"\2212"}
details.faq p{margin:0 0 16px;color:var(--muted);white-space:pre-line}
.tile{cursor:zoom-in;padding:0}.tile img{transition:transform .4s}.tile:hover img{transform:scale(1.05)}
.lb{position:fixed;inset:0;background:rgba(10,20,40,.88);display:none;place-items:center;z-index:60;cursor:zoom-out}.lb.on{display:grid}.lb img{max-width:92vw;max-height:88vh;border-radius:12px}
.menu{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:42px;height:42px;place-items:center;cursor:pointer}.menu svg{width:22px;height:22px;stroke:var(--navy);fill:none;stroke-width:2}
@media(max-width:960px){.menu{display:inline-grid}nav.open{display:block;position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:1px solid var(--line);padding:16px 24px}nav.open ul{display:grid!important;gap:14px}}
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease}.rv.in{opacity:1;transform:none}
.card.rv.in:hover{transform:translateY(-5px)}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
 .card{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.card:hover{transform:translateY(-6px);box-shadow:0 0 0 2px var(--sky),0 20px 40px rgba(18,48,92,.15);border-color:var(--sky)}
.card .qicon{transition:transform .3s ease}
.card:hover .qicon{transform:scale(1.15) rotate(-6deg)}
 /* Quick cards: spotlight hover */
.qcard{position:relative;overflow:hidden;transition:opacity .6s ease,transform .6s ease,box-shadow .25s ease,border-color .25s ease}
.qcard::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s ease;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(44,155,209,.20),transparent 70%)}
.qcard>*{position:relative}
.qcard:hover{border-color:var(--sky);box-shadow:0 0 0 1.5px var(--sky),0 16px 36px rgba(18,48,92,.14)}
.qcard:hover::before{opacity:1}
.qcard .qicon{transition:transform .3s ease}
.qcard:hover .qicon{transform:scale(1.12) rotate(-6deg)}
 /* Quick cards: status badge + countdown */
.qcard b{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qbadge{display:inline-flex;align-items:center;gap:6px;font:600 11px "Source Sans 3",sans-serif;padding:2px 9px;border-radius:99px;background:var(--tint);color:var(--navy)}
.qbadge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sky);animation:qpulse 1.8s ease-out infinite}
.qbadge.open{background:#e3f6ec;color:#17693f}
.qbadge.open::before{background:#22a861}
.qcount{display:block;margin-top:4px;font:600 13px Sora,sans-serif;color:var(--sky);font-variant-numeric:tabular-nums}
@keyframes qpulse{0%{box-shadow:0 0 0 0 rgba(44,155,209,.5)}100%{box-shadow:0 0 0 7px rgba(44,155,209,0)}}
@media(prefers-reduced-motion:reduce){.qbadge::before{animation:none}}
/* Notify-me popup */
.nm{border:0;border-radius:20px;padding:28px;width:min(440px,92vw);box-shadow:0 30px 70px rgba(18,48,92,.3);color:var(--ink)}
.nm::backdrop{background:rgba(10,20,40,.6);backdrop-filter:blur(3px)}
.nm h3{font-size:22px;margin-bottom:6px}
.nm p{margin:0 0 16px;color:var(--muted)}
.nm input[type=text]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;margin-bottom:12px}
.nm input[type=text]:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(44,155,209,.2)}
.nm .row{display:flex;gap:10px;justify-content:flex-end}
.nm .msg{min-height:22px;margin:0 0 6px;font-size:15px;font-weight:600;color:var(--navy)}
button.btn{font:inherit;font-weight:600;cursor:pointer}
 /* Flip card */
.qcard {
  min-height: 110px;
  perspective: 800px;
}
.qcard-inner {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 110px;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(.4,0,.2,1);
}
.qcard:hover .qcard-inner {
  transform: rotateY(180deg);
}
.qcard-front,
.qcard-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 16px 18px;
  border-radius: 14px;
}
.qcard-back {
  transform: rotateY(180deg);
  background: var(--navy);
  color: #fff;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}
.qcard-back p {
  margin: 0;
  font-size: 14px;
  color: #cfe3f4;
  line-height: 1.5;
}
.qcard-back-title {
  font-family: Sora, sans-serif;
  font-weight: 600;
  font-size: 15px;
  color: #fff;
}
.qcard-back-btn {
  margin-top: 4px;
  display: inline-block;
  padding: 6px 14px;
  border-radius: 8px;
  background: var(--sky);
  color: #fff;
  font-weight: 600;
  font-size: 13px;
  border: none;
  cursor: pointer;
}
 /* Scrolling image marquee */
.marquee-wrap {
  overflow: hidden;
  width: 100%;
  margin: 28px 0 0;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
}
.marquee-track {
  display: flex;
  gap: 14px;
  width: max-content;
  animation: marquee-scroll 28s linear infinite;
}
.marquee-wrap:hover .marquee-track {
  animation-play-state: paused;
}
.marquee-img {
  height: 220px;
  width: 320px;
  object-fit: cover;
  border-radius: 14px;
  flex-shrink: 0;
  border: 1px solid var(--line);
}
@keyframes marquee-scroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
 /* Scrolling text ticker */
.ticker-wrap {
  overflow: hidden;
  width: 100%;
  margin-top: 16px;
  background: var(--navy);
  border-radius: 10px;
  padding: 10px 0;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
}
.ticker-track {
  display: flex;
  gap: 0;
  width: max-content;
  animation: ticker-scroll 22s linear infinite;
}
.ticker-wrap:hover .ticker-track {
  animation-play-state: paused;
}
.ticker-item {
  white-space: nowrap;
  padding: 0 32px;
  font: 600 14px Sora, sans-serif;
  color: #cfe3f4;
  display: flex;
  align-items: center;
  gap: 10px;
}
.ticker-item::after {
  content: "●";
  color: var(--sky);
  font-size: 8px;
}
@keyframes ticker-scroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
 /* Updates carousel */
.upd-carousel {
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  margin-top: 26px;
}
.upd-track {
  display: flex;
  transition: transform 0.5s cubic-bezier(.4,0,.2,1);
}
.upd-slide {
  min-width: 100%;
  box-sizing: border-box;
}
.upd-slide .card {
  margin: 0;
}
.upd-arrows {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 16px;
}
.upd-arr {
  background: var(--navy);
  border: none;
  color: #fff;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  display: grid;
  place-items: center;
  transition: background 0.2s;
}
.upd-arr:hover {
  background: var(--sky);
}
.upd-counter {
  display: flex;
  align-items: center;
  font: 600 14px Sora, sans-serif;
  color: var(--muted);
  min-width: 48px;
  justify-content: center;
}
</style>

<script>
(function(){
  var logo=document.getElementById('logo3d'),base=document.getElementById('logoImg');
  var N=9,GAP=5,layers=[base];
  for(var i=1;i<N;i++){
    var c=base.cloneNode();c.removeAttribute('id');c.alt='';c.setAttribute('aria-hidden','true');
    c.style.filter='brightness('+(0.72-i*0.035)+') saturate(1.1)';
    logo.insertBefore(c,base);layers.unshift(c);
  }
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function place(s){layers.forEach(function(el,idx){el.style.transform='translateZ('+(-(N-1-idx)*GAP*s)+'px)';});}
  base.style.filter='drop-shadow(0 18px 18px rgba(18,48,92,.18))';
  if(reduce){place(1);return;}
  place(30);
  requestAnimationFrame(function(){requestAnimationFrame(function(){place(1);});});
  var mx=0,my=0,tx=0,ty=0,t0=performance.now(),active=false,stage=document.getElementById('stage');
  stage.addEventListener('pointermove',function(e){var r=stage.getBoundingClientRect();mx=((e.clientX-r.left)/r.width-.5)*2;my=((e.clientY-r.top)/r.height-.5)*2;active=true;});
  stage.addEventListener('pointerleave',function(){active=false;});
  (function loop(now){
    var t=(now-t0)/1000,gy=active?mx*26:Math.sin(t*.8)*16,gx=active?-my*14:Math.cos(t*.6)*4+3;
    tx+=(gx-tx)*.08;ty+=(gy-ty)*.08;
    logo.style.transform='rotateX('+tx.toFixed(2)+'deg) rotateY('+ty.toFixed(2)+'deg)';
    requestAnimationFrame(loop);
  })(t0);
})();
</script>

  $('fConnect').innerHTML=soc.map(function(k){return '<li><a href="'+esc(L[k])+'" target="_blank" rel="noopener">'+BR[k][0]+'</a></li>';}).join('')+(vis.indexOf('contact')>-1?'<li><a href="#contact">Contact</a></li>':'');
  $('fTag').textContent=F.tagline||d.tagline||''; $('fCopy').textContent=F.copyright||'';
  reveal();
}
function reveal(){var els=document.querySelectorAll('.head,.card,.qcard,.stat,.tile,details.faq,.soc a');
  if(!('IntersectionObserver' in window)){return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.08});
  Array.prototype.forEach.call(els,function(e){e.classList.add('rv');io.observe(e);});}

 var lb=$('lb');
